name: Deploy web demo to gh-pages

on:
  push:
    branches:
      - claude/add-claude-documentation-KfExb
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build keyless static demo
        env:
          PET_BASE: './'
          VITE_PET_MODE: static
        run: pnpm --filter @pet-genius/demo exec vite build

      - name: Publish to gh-pages
        run: |
          set -e
          cd apps/demo/dist
          rm -rf **/*.map || true
          touch .nojekyll
          git init -q
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add -A
          git commit -qm "demo build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:gh-pages
