[package]
name = "pet-genius-desktop"
version = "0.1.0"
description = "Floating AI-driven pixel pet on your desktop."
edition = "2021"
rust-version = "1.77"

[lib]
name = "pet_genius_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
